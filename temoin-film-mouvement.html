<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Témoin — le film d'ouverture de /mouvement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Témoin — 9 septembre 2026. L'ouverture de /mouvement en film : un seul objet
   (un menu en skeleton), une devinette, sa résolution, la phrase au bon moment.
   Script validé par Auteur. Jetons du kit : quatre durées, une courbe. */
:root {
  --bg:#FFFFFF; --surface:#F3F4F6; --surface-hover:#E6E7EB;
  --text:#151725; --text-2:#505362; --text-3:#8A8C9B;
  --border:#E6E7EB; --border-strong:#6E717F;
  --primary:#4F46E5; --accent:#75E242;
  --sans:"Geist",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --m-fast:100ms; --m-base:200ms; --m-slow:300ms; --m-expressive:700ms;
  --e-out:cubic-bezier(0.23,1,0.32,1);
  --slow:4; /* le ralenti des temps 4 et 5 */
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:16px; line-height:1.5; }
.wrap { max-width:1080px; margin:0 auto; padding:48px 32px 96px; }
.kicker { font:600 12px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); margin:0 0 12px; }
h1 { font-size:34px; font-weight:600; letter-spacing:-.02em; margin:0 0 8px; }
.lede { color:var(--text-2); margin:0 0 40px; max-width:60ch; font-size:18px; }

/* ── Le film ── */
.film { display:grid; gap:20px; }
.stage { position:relative; min-height:26rem; border-radius:16px; background:var(--surface); overflow:hidden;
  display:grid; justify-items:center; align-items:start; padding-top:5.5rem; }
.stage:focus-visible { outline:2px solid #7881FD; outline-offset:2px; }
.pair { display:grid; grid-template-columns:auto auto; gap:6rem; align-items:start; transition:gap var(--m-expressive) var(--e-out); }
.pair.solo { gap:0; }
/* un menu en skeleton : un bouton, quatre lignes. Pas un mot. */
.dd { position:relative; width:12rem; transition:opacity var(--m-slow) var(--e-out); }
.dd.dim { opacity:.28; }
.dd.gone { opacity:0; }
.dd-btn { height:2.75rem; border-radius:6px; background:var(--bg); border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:space-between; padding:0 .9rem; }
.dd-btn i { display:block; width:5rem; height:.55rem; border-radius:999px; background:var(--surface-hover); }
.dd-btn svg { width:.8rem; height:.8rem; color:var(--text-3); transition:rotate var(--m-fast) var(--e-out); }
.dd.open .dd-btn svg { rotate:180deg; }
.dd-menu { position:absolute; top:calc(2.75rem + .45rem); left:0; width:100%; padding:.5rem; display:grid; gap:.35rem;
  background:var(--bg); border:1px solid var(--border); border-radius:8px; box-shadow:0 24px 50px -28px rgba(5,6,17,.55);
  opacity:0; pointer-events:none; }
.dd-menu i { display:block; height:2rem; border-radius:4px; background:var(--surface); position:relative; }
.dd-menu i::after { content:""; position:absolute; left:.7rem; top:.72rem; height:.55rem; width:55%; border-radius:999px; background:var(--surface-hover); }
.dd-menu i:nth-child(2)::after { width:70%; } .dd-menu i:nth-child(3)::after { width:45%; } .dd-menu i:nth-child(4)::after { width:62%; }
.dd.open .dd-menu { opacity:1; }
/* le second : il grandit depuis le coin qui touche son bouton, au cran du menu */
.dd.good .dd-menu { transform-origin:0 0; scale:.92; translate:0 -.4rem;
  transition:opacity calc(var(--m-base) * var(--k,1)) var(--e-out), scale calc(var(--m-base) * var(--k,1)) var(--e-out), translate calc(var(--m-base) * var(--k,1)) var(--e-out); }
.dd.good.open .dd-menu { scale:1; translate:0 0; }
/* le premier : il surgit — aucune transition, c'est la faute de tous les jours */
.dd.bad .dd-menu { transition:none; }
.dd.slow { --k:var(--slow); }
.dd.snap .dd-menu { transition:none !important; }
/* le point de couleur : là d'où part le menu */
.dot { position:absolute; z-index:3; width:.85rem; height:.85rem; border-radius:999px; background:var(--accent); box-shadow:0 0 0 .3rem color-mix(in srgb, var(--accent) 30%, transparent);
  left:0; top:calc(2.75rem + .45rem); translate:-50% -50%; opacity:0; scale:.4;
  transition:opacity var(--m-slow) var(--e-out), scale var(--m-slow) var(--e-out); }
.dot.on { opacity:1; scale:1; }
.dot.lost { animation:lost var(--m-expressive) var(--e-out) 2 alternate; }
@keyframes lost { to { translate:-50% 3.2rem; opacity:.35; } }

/* la phrase : elle parle au bon moment */
.line { min-height:4.6rem; font-size:24px; line-height:1.3; letter-spacing:-.015em; max-width:34ch; color:var(--text-2);
  transition:opacity var(--m-slow) var(--e-out), translate var(--m-slow) var(--e-out); }
.line b { color:var(--text); font-weight:600; }
.line.off { opacity:0; translate:0 .4rem; }

/* le lecteur */
.player { display:flex; align-items:center; gap:10px; }
.circle { width:2.5rem; height:2.5rem; border-radius:999px; border:1px solid var(--border-strong); background:var(--bg); color:var(--text); display:grid; place-items:center; cursor:pointer; font:inherit;
  transition:background-color var(--m-fast) var(--e-out); }
.circle:hover { background:var(--surface-hover); }
.circle:focus-visible { outline:2px solid #7881FD; outline-offset:2px; }
.circle.on { background:var(--text); border-color:var(--text); color:var(--bg); }
.circle svg { width:1rem; height:1rem; fill:currentColor; }
.circle .ic { display:none; } .circle[data-state="play"] .ic-play, .circle[data-state="pause"] .ic-pause, .circle[data-state="re"] .ic-re { display:block; }
.cnt { font:600 13px var(--mono); color:var(--text-3); letter-spacing:.06em; min-width:3.5rem; }
.bar { flex:1; height:2px; background:var(--border); border-radius:999px; overflow:hidden; max-width:16rem; }
.bar i { display:block; height:100%; width:0; background:var(--text); }

@media (max-width:40rem) {
  .pair { gap:2rem; } .dd { width:9.5rem; } .line { font-size:20px; } .stage { min-height:22rem; }
}
@media (prefers-reduced-motion: reduce) {
  .dd.good .dd-menu { scale:none; translate:none; transition:opacity calc(var(--m-base) * var(--k,1)) var(--e-out); }
  .dot { scale:1; } .dot.lost { animation:none; }
  .line, .pair, .dd-btn svg { transition:none; }
}
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">Témoin · 9 septembre 2026 · le film d'ouverture</p>
  <h1>Le mouvement garde le fil</h1>
  <p class="lede">Un écran change tout le temps. Le mouvement dit ce qui vient de changer, d'où ça vient et où regarder — sans qu'on ait à chercher.</p>

  <div class="film" id="film">
    <div class="stage" id="stage" tabindex="0" aria-label="Le film : un menu, deux fois, et ce qui les sépare">
      <div class="pair" id="pair">
        <div class="dd bad gone" id="L"><div class="dd-btn"><i></i><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div><span class="dot" id="dotL"></span><div class="dd-menu"><i></i><i></i><i></i><i></i></div></div>
        <div class="dd good" id="R"><div class="dd-btn"><i></i><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div><span class="dot" id="dotR"></span><div class="dd-menu"><i></i><i></i><i></i><i></i></div></div>
      </div>
    </div>
    <p class="line off" id="line" aria-live="polite"></p>
    <div class="player">
      <button class="circle" type="button" id="prev" aria-label="Temps précédent">←</button>
      <button class="circle on" type="button" id="play" data-state="play" aria-label="Lire">
        <svg class="ic ic-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>
        <svg class="ic ic-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></svg>
        <svg class="ic ic-re" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3a5 5 0 1 0 4.6 3h-1.7A3.4 3.4 0 1 1 8 4.6V7l3.5-3L8 1z"/></svg>
      </button>
      <button class="circle" type="button" id="next" aria-label="Temps suivant">→</button>
      <span class="cnt" id="cnt">1 / 6</span>
      <span class="bar" aria-hidden="true"><i id="bar"></i></span>
    </div>
  </div>
</div>

<script>
/* ── Le script du film : six temps. Chaque temps pose sa scène, dit sa phrase,
   et déroule ses gestes à l'instant dit (en ms depuis le début du temps). ── */
const $ = (id) => document.getElementById(id);
const L = $("L"), R = $("R"), pair = $("pair"), line = $("line"), dotL = $("dotL"), dotR = $("dotR");
const cls = (el, add = [], rm = []) => { el.classList.remove(...rm); el.classList.add(...add); };
const open = (el, on) => el.classList.toggle("open", on);
const snap = (el, fn) => { el.classList.add("snap"); fn(); el.getBoundingClientRect(); el.classList.remove("snap"); };
const say = (html) => { line.classList.add("off"); setTimeout(() => { line.innerHTML = html; line.classList.remove("off"); }, 320); };

const STEPS = [
  { hold: 5600, // 1 · un menu
    set() { cls(pair, ["solo"]); cls(L, ["gone"], ["dim"]); cls(R, [], ["dim", "slow", "gone"]); open(L, false); open(R, false); dotR.className = "dot"; dotL.className = "dot"; },
    line: "<b>Un menu.</b> On en ouvre cinquante par jour sans le regarder.",
    cues: [[900, () => open(R, true)], [3300, () => open(R, false)]] },
  { hold: 9200, // 2 · deux fois le même
    set() { cls(pair, [], ["solo"]); cls(L, [], ["gone", "dim"]); cls(R, [], ["dim", "slow"]); snap(L, () => open(L, false)); snap(R, () => open(R, false)); },
    line: "<b>Deux fois le même.</b> L'un des deux semble plus juste — sans qu'on sache dire pourquoi.",
    cues: [[1400, () => { open(L, true); open(R, true); }], [3800, () => { open(L, false); open(R, false); }], [5400, () => { open(L, true); open(R, true); }]] },
  { hold: 3600, // 3 · choisir
    set() { cls(pair, [], ["solo"]); cls(L, [], ["gone", "dim"]); cls(R, [], ["dim", "slow"]); snap(L, () => open(L, true)); snap(R, () => open(R, true)); },
    line: "C'est le moment de choisir.",
    cues: [] },
  { hold: 7600, // 4 · le second, au ralenti
    set() { cls(pair, [], ["solo"]); cls(L, ["dim"], ["gone"]); cls(R, ["slow"], ["dim"]); snap(L, () => open(L, true)); snap(R, () => open(R, false)); dotR.className = "dot"; },
    line: "<b>Celui-ci part de là où on a cliqué.</b> Il grandit depuis son bouton, en décélérant : deux dixièmes de seconde.",
    cues: [[900, () => dotR.classList.add("on")], [1700, () => open(R, true)], [4300, () => open(R, false)], [5400, () => open(R, true)]] },
  { hold: 7200, // 5 · le premier, au ralenti
    set() { cls(pair, [], ["solo"]); cls(L, ["slow"], ["gone", "dim"]); cls(R, ["dim"], ["slow"]); snap(L, () => open(L, false)); snap(R, () => open(R, true)); dotR.className = "dot"; dotL.className = "dot"; },
    line: "<b>Celui-là n'est parti de nulle part.</b> Rien ne dit d'où il vient, ni à quoi il appartient.",
    cues: [[900, () => dotL.classList.add("on")], [1700, () => open(L, true)], [2000, () => dotL.classList.add("lost")], [3600, () => dotL.classList.remove("on", "lost")], [4600, () => open(L, false)], [5400, () => open(L, true)]] },
  { hold: 8000, // 6 · le second seul, vitesse réelle
    set() { cls(pair, ["solo"]); cls(L, ["gone"], ["dim", "slow"]); cls(R, [], ["dim", "slow"]); snap(L, () => open(L, false)); snap(R, () => open(R, false)); dotR.className = "dot"; dotL.className = "dot"; },
    line: "<b>On ne voit pas ce mouvement. On le sent.</b> C'est ce qu'il apporte : savoir d'où vient une chose, sans avoir à chercher.",
    cues: [[1100, () => open(R, true)], [3100, () => open(R, false)], [4600, () => open(R, true)], [6400, () => open(R, false)]] },
];

/* ── Le lecteur : Lire joue les six temps à la suite ; ← → posent un temps ;
   à la fin, le bouton propose de rejouer. ── */
let i = 0, playing = false, timers = [], raf = 0, t0 = 0;
const play = $("play"), bar = $("bar"), cnt = $("cnt");
function clear() { timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); }
function pose(n, run) {
  clear(); i = (n + STEPS.length) % STEPS.length;
  const s = STEPS[i]; s.set(); say(s.line); cnt.textContent = `${i + 1} / ${STEPS.length}`;
  if (!run) { bar.style.width = "0"; return; }
  s.cues.forEach(([at, fn]) => timers.push(setTimeout(fn, at)));
  t0 = performance.now();
  const tick = (now) => { bar.style.width = `${Math.min(100, (now - t0) / s.hold * 100)}%`; raf = requestAnimationFrame(tick); };
  raf = requestAnimationFrame(tick);
  timers.push(setTimeout(() => { if (i + 1 < STEPS.length) pose(i + 1, true); else end(); }, s.hold));
}
function state(st) { play.dataset.state = st; play.setAttribute("aria-label", st === "play" ? "Lire" : st === "pause" ? "Arrêter" : "Rejouer"); }
function start(from = 0) { playing = true; state("pause"); pose(from, true); }
function stop() { playing = false; clear(); bar.style.width = "0"; state("play"); }
function end() { playing = false; clear(); bar.style.width = "100%"; state("re"); }
play.addEventListener("click", () => { if (play.dataset.state === "pause") stop(); else if (play.dataset.state === "re") start(0); else start(i); });
$("prev").addEventListener("click", () => { stop(); pose(i - 1, false); });
$("next").addEventListener("click", () => { stop(); pose(i + 1, false); });
$("stage").addEventListener("keydown", (e) => { if (e.key === "ArrowRight") { stop(); pose(i + 1, false); } if (e.key === "ArrowLeft") { stop(); pose(i - 1, false); } if (e.key === " ") { e.preventDefault(); play.click(); } });
pose(0, false);
/* le film part de lui-même la première fois qu'on le voit — puis c'est au lecteur */
new IntersectionObserver((e, o) => { if (e[0].isIntersecting) { start(0); o.disconnect(); } }, { threshold: .5 }).observe($("film"));
</script>
</body>
</html>
