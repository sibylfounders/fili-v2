<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Fixture positive — rendu</title><link rel="stylesheet" href="/_tokens.css">
</head><body>
  <h1>Titre de la page</h1>
  <h2>Sous-titre au bon niveau</h2>
  <p><a href="#un" class="ds-focus-ring">lien à l'anneau du système</a></p>
  <p><button class="ds-focus-ring" style="--taille: 40px; width: var(--taille); height: var(--taille)">ok</button></p>
  <!-- Input conforme : l'élément actif délègue visuellement son focus au cadre parent
       ([data-slot=input]:has(input:focus-visible)) — le harnais doit l'ACCEPTER. -->
  <p><span data-slot="input"><input aria-label="Champ au focus délégué" value="texte"></span></p>
  <!-- Chaîne de validation CORRECTE : le message existe, il est désigné, et l'erreur annoncée
       est lisible. Le harnais ne doit rien y trouver. -->
  <p><span data-slot="input"><input aria-label="Adresse e-mail" aria-invalid="true"
       aria-describedby="msg-courriel" value="06 12 34 56 78"></span></p>
  <p id="msg-courriel">Erreur : saisissez une adresse au format nom@domaine.fr</p>
  <!-- Groupe : l'erreur appartient au fieldset ; les options héritent d'aria-invalid et
       remontent au porteur du message. -->
  <fieldset aria-describedby="msg-formule">
    <legend>Formule</legend>
    <label><input type="radio" name="f" class="ds-focus-ring" style="width:24px;height:24px" aria-invalid="true"> Mensuel</label>
    <label><input type="radio" name="f" class="ds-focus-ring" style="width:24px;height:24px" aria-invalid="true"> Annuel</label>
    <p id="msg-formule">Erreur : choisissez une formule pour continuer.</p>
  </fieldset>
</body></html>
